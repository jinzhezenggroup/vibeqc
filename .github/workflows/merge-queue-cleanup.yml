name: Merge queue cleanup

on:
  pull_request_target:
    types: [dequeued]
  delete:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel_orphaned_runs:
    name: Cancel orphaned merge-group runs
    if: ${{ github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'gh-readonly-queue/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued or running CI whose merge-group ref was deleted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          page=1
          while :; do
            payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f event=merge_group -f per_page=100 -f page="${page}")"
            count="$(jq '.workflow_runs | length' <<<"${payload}")"

            while IFS=$'\t' read -r run_id status head_branch html_url; do
              [[ -n "${run_id}" ]] || continue
              case "${status}" in
                queued|in_progress|waiting|pending|requested) ;;
                *) continue ;;
              esac
              [[ "${head_branch}" == gh-readonly-queue/* ]] || continue

              ref_status="$(curl --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${head_branch}" || true)"

              case "${ref_status}" in
                200)
                  ;;
                404)
                  echo "::notice::Canceling orphaned merge-group run ${run_id}: ${head_branch}"
                  if ! gh api --method POST \
                    "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                    >/dev/null 2>&1; then
                    echo "::notice::Run ${run_id} became terminal before cancellation."
                  fi
                  ;;
                *)
                  # Cleanup is an optimization only. If GitHub cannot prove that
                  # a ref is gone, preserve the run rather than risking a false
                  # successful merge without its required checks.
                  echo "::warning::Could not verify ${head_branch} (HTTP ${ref_status:-unknown}); leaving run ${run_id} active."
                  ;;
              esac
            done < <(
              jq -r \
                '.workflow_runs[] | [.id, .status, (.head_branch // ""), .html_url] | @tsv' \
                <<<"${payload}"
            )

            (( count < 100 )) && break
            ((page += 1))
          done
