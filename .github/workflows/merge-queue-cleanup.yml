name: Merge queue cleanup

on:
  pull_request_target:
    types: [dequeued]
  delete:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel_orphaned_runs:
    name: Cancel orphaned merge-group runs
    if: ${{ github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'gh-readonly-queue/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued or running CI whose merge-group ref or commit is obsolete
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ref_body="$(mktemp)"
          trap 'rm -f "${ref_body}"' EXIT
          page=1
          while :; do
            payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f event=merge_group -f per_page=100 -f page="${page}")"
            count="$(jq '.workflow_runs | length' <<<"${payload}")"

            while IFS=$'\t' read -r run_id status head_branch head_sha html_url; do
              [[ -n "${run_id}" ]] || continue
              case "${status}" in
                queued|in_progress|waiting|pending|requested) ;;
                *) continue ;;
              esac
              [[ "${head_branch}" == gh-readonly-queue/* ]] || continue

              ref_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
                --output "${ref_body}" --write-out '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${head_branch}" || true)"

              obsolete=false
              case "${ref_status}" in
                200)
                  live_sha="$(jq -r '.object.sha // empty' "${ref_body}" 2>/dev/null || true)"
                  if [[ "${head_sha}" =~ ^[0-9a-f]{40}$ && "${live_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                    [[ "${head_sha}" == "${live_sha}" ]] || obsolete=true
                  else
                    echo "::warning::Missing valid commit identity for ${head_branch}; leaving run ${run_id} active."
                  fi
                  ;;
                404)
                  obsolete=true
                  ;;
                *)
                  # Cleanup is an optimization only. Missing or ambiguous API
                  # evidence must not cancel a potentially current queue run.
                  echo "::warning::Could not verify ${head_branch} (HTTP ${ref_status:-unknown}); leaving run ${run_id} active."
                  ;;
              esac
              if [[ "${obsolete}" == true ]]; then
                echo "::notice::Canceling orphaned merge-group run ${run_id}: ${head_branch} at ${head_sha}"
                if ! gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null 2>&1; then
                  echo "::notice::Run ${run_id} became terminal before cancellation."
                fi
              fi
            done < <(
              jq -r \
                '.workflow_runs[] | [.id, .status, (.head_branch // "-"), (.head_sha // "-"), .html_url] | @tsv' \
                <<<"${payload}"
            )

            (( count < 100 )) && break
            ((page += 1))
          done
