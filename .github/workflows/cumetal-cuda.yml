name: CuMetal CUDA

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

concurrency:
  group: cumetal-cuda-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cuda-tests:
    name: CUDA runtime tests (CuMetal / Apple GPU)
    runs-on: macos-15
    # Keep the 50-minute full-suite step inside a separate finite job budget.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
    env:
      CUMETAL_COMMIT: 8a1434ffc1a4f7a17d2f8a41e157afbac22af171
      CUMETAL_SOURCE: /tmp/cuda-metal
      CUMETAL_PREFIX: /tmp/cumetal-install
      CUMETAL_CCACHE_DIR: /tmp/cumetal-ccache
      VIBEQC_BUILD: ${{ github.workspace }}/build-cumetal
      CCACHE_DIR: /tmp/vibeqc-ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true

      - name: Prepare Python codegen environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python numpy

      - name: Install CuMetal build prerequisites and ccache
        run: brew install llvm z3 ninja ccache

      - name: Cache CuMetal toolchain
        id: cache-cumetal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cuda-metal
            /tmp/cumetal-install
          key: cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}

      - name: Restore CuMetal ccache
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CUMETAL_CCACHE_DIR }}
          key: ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}
          restore-keys: |
            ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore VibeQC ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'include/**', 'src/**', 'tests/native/**', 'tools/**') }}
          restore-keys: |
            ccache-cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}-

      - name: Build pinned CuMetal
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ env.CUMETAL_CCACHE_DIR }}
          CCACHE_COMPILERCHECK: content
        run: |
          ccache --zero-stats
          git clone --recurse-submodules https://github.com/Lulzx/cuda-metal.git "$CUMETAL_SOURCE"
          git -C "$CUMETAL_SOURCE" checkout "$CUMETAL_COMMIT"
          git -C "$CUMETAL_SOURCE" submodule update --init --recursive
          cmake -S "$CUMETAL_SOURCE" -B "$CUMETAL_SOURCE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CUMETAL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCUMETAL_BUILD_TESTS=OFF \
            -DCUMETAL_ENABLE_BINARY_SHIM=OFF \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm"
          cmake --build "$CUMETAL_SOURCE/build" --parallel 3
          cmake --install "$CUMETAL_SOURCE/build"
          ccache --show-stats

      - name: Verify CuMetal
        run: CUMETAL_ROOT="$CUMETAL_PREFIX" "$CUMETAL_PREFIX/bin/cumetal" doctor

      - name: Generate a CMake CUDA toolkit backed by CuMetal
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          if [[ ! -x "$FAKE_CUDA/bin/nvcc" ]]; then
            CUMETAL_BUILD_DIR="$CUMETAL_SOURCE/build" \
              bash "$CUMETAL_SOURCE/scripts/build_llama_cpp_cumetal.sh" --toolkit-only
          fi
          # VibeQC requires CUDA Toolkit >= 12.9. CuMetal's compatibility shim
          # reports 12.2 by default even though this lane is not using NVIDIA
          # toolkit implementation details; make the compatibility identity
          # satisfy VibeQC's configured minimum.
          for file in \
            "$FAKE_CUDA/version.json" \
            "$FAKE_CUDA/version.txt" \
            "$FAKE_CUDA/bin/nvcc" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfig.cmake" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfigVersion.cmake"; do
            if [[ -f "$file" ]]; then
              sed -i '' 's/12\.2/12.9/g' "$file"
            fi
          done
          # CuMetal implements these APIs in libcumetal.dylib. Ensure CMake's
          # FindCUDAToolkit can resolve the library names VibeQC links.
          for libdir in lib lib64; do
            mkdir -p "$FAKE_CUDA/$libdir"
            for lib in cudart cublas cublasLt cusolver; do
              ln -sf "$CUMETAL_SOURCE/build/libcumetal.dylib" \
                "$FAKE_CUDA/$libdir/lib${lib}.dylib"
            done
          done
          "$FAKE_CUDA/bin/nvcc" --version

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Configure VibeQC with CUDA tests enabled
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          PATH="$FAKE_CUDA/bin:$PATH" cmake -S . -B "$VIBEQC_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_CUDA_COMPILER="$FAKE_CUDA/bin/nvcc" \
            -DCMAKE_CUDA_COMPILER_LIBRARY_ROOT="$FAKE_CUDA" \
            -DCUDAToolkit_ROOT="$FAKE_CUDA" \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" \
            -DVIBEQC_CUDA_ARCHITECTURES=80 \
            -DVIBEQC_CUDA_COMPILE_ARCHITECTURES=80 \
            -DVIBEQC_CUDA_PROVIDER=cumetal \
            -DVIBEQC_BUILD_TESTS=ON \
            -DVIBEQC_COMPILER_CACHE=ccache

      - name: Build CUDA runtime test target
        run: cmake --build "$VIBEQC_BUILD" --target vibeqc_cuda_runtime_tests --parallel 3

      - name: Show ccache statistics
        run: ccache --show-stats

      # CuMetal's fake-nvcc CMake path currently links a normal CUDA executable
      # but does not embed the metallib needed by its runtime registration. Use
      # CuMetal's source-first compiler for the execution image while retaining
      # the same source file, CMake target and CTest registration used by nvcc.
      - name: Prepare CuMetal execution image for the normal CTest
        run: |
          CUMETAL_ROOT="$CUMETAL_PREFIX" \
            "$CUMETAL_PREFIX/bin/cumetalc" tests/native/test_cuda_runtime.cu \
            -I"$CUMETAL_PREFIX/include" \
            -I"${GITHUB_WORKSPACE}" \
            -I"${GITHUB_WORKSPACE}/include" \
            -I"${GITHUB_WORKSPACE}/src" \
            -o "$VIBEQC_BUILD/vibeqc_cuda_runtime_tests.cumetal"
          mv "$VIBEQC_BUILD/vibeqc_cuda_runtime_tests" \
             "$VIBEQC_BUILD/vibeqc_cuda_runtime_tests.cmake"
          mv "$VIBEQC_BUILD/vibeqc_cuda_runtime_tests.cumetal" \
             "$VIBEQC_BUILD/vibeqc_cuda_runtime_tests"

      - name: Run CUDA runtime CTest on the Apple GPU
        timeout-minutes: 2
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          CUMETAL_ROOT="$CUMETAL_PREFIX" \
          DYLD_LIBRARY_PATH="$CUMETAL_SOURCE/build${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
          CUMETAL_TRACE_GPU=1 \
            ctest --test-dir "$VIBEQC_BUILD" -V \
              -R '^vibeqc_cuda_runtime_tests$' \
              --output-junit "$GITHUB_WORKSPACE/test-results/vibeqc-cuda-runtime-junit.xml" \
              2>&1 | tee /tmp/vibeqc-cuda-runtime.log
          grep -q 'device=apple_gpu' /tmp/vibeqc-cuda-runtime.log
          grep -q 'launch_success=true' /tmp/vibeqc-cuda-runtime.log
          grep -q 'PASS: CUDA runtime contracts' /tmp/vibeqc-cuda-runtime.log

      - name: Install resident-response test dependency
        if: github.event_name == 'pull_request'
        run: uv pip install --python .venv/bin/python pytest

      # This NVIDIA-only test skips on CuMetal. Keep the skip visible rather
      # than labeling a successful collection as resident GPU qualification.
      - name: Report NVIDIA-only resident-response test coverage
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libvibeqc.dylib
          CUMETAL_TRACE_GPU: "1"
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest \
            tests/python/test_cuda_runtime.py::test_cuda_resident_rhf_response_matches_host_operator \
            -vv -rs

      - name: Preserve CUDA test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-cuda-runtime
          path: test-results/vibeqc-cuda-runtime-junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Install Python test dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv pip install --python .venv/bin/python --editable '.[test]'

      - name: Run full CUDA suite on the Apple GPU
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 50
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libvibeqc.dylib
          CUMETAL_TRACE_GPU: "1"
          CUMETAL_CUDA_TEST_MODE: full
          CUMETAL_CUDA_TEST_TIMEOUT_SECONDS: "300"
        run: .venv/bin/python .github/scripts/run_cumetal_cuda_pytests.py


  cumetal-benchmark:
    name: CuMetal performance (CodSpeed / Apple GPU)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CUMETAL_COMMIT: 8a1434ffc1a4f7a17d2f8a41e157afbac22af171
      CUMETAL_SOURCE: /tmp/cuda-metal
      CUMETAL_PREFIX: /tmp/cumetal-install
      CUMETAL_CCACHE_DIR: /tmp/cumetal-ccache
      VIBEQC_BENCH_BUILD: ${{ github.workspace }}/build-cumetal-benchmark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcrun --find metal

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true

      - name: Prepare benchmark environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python pytest-codspeed==5.0.3
          brew install llvm z3 ninja ccache

      - name: Cache CuMetal toolchain
        id: cache-cumetal
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cuda-metal
            /tmp/cumetal-install
          key: cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}

      - name: Restore CuMetal build ccache
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CUMETAL_CCACHE_DIR }}
          key: ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}
          restore-keys: |
            ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build pinned CuMetal on a cold cache
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ env.CUMETAL_CCACHE_DIR }}
          CCACHE_COMPILERCHECK: content
        run: |
          ccache --zero-stats
          git clone --recurse-submodules https://github.com/Lulzx/cuda-metal.git "$CUMETAL_SOURCE"
          git -C "$CUMETAL_SOURCE" checkout "$CUMETAL_COMMIT"
          git -C "$CUMETAL_SOURCE" submodule update --init --recursive
          cmake -S "$CUMETAL_SOURCE" -B "$CUMETAL_SOURCE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CUMETAL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCUMETAL_BUILD_TESTS=OFF \
            -DCUMETAL_ENABLE_BINARY_SHIM=OFF \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm"
          cmake --build "$CUMETAL_SOURCE/build" --parallel 3
          cmake --install "$CUMETAL_SOURCE/build"

      - name: Verify CuMetal
        run: CUMETAL_ROOT="$CUMETAL_PREFIX" "$CUMETAL_PREFIX/bin/cumetal" doctor

      - name: Build CuMetal FP32 CodSpeed benchmark
        run: |
          mkdir -p "$VIBEQC_BENCH_BUILD"
          CUMETAL_ROOT="$CUMETAL_PREFIX" \
            "$CUMETAL_PREFIX/bin/cumetalc" benchmarks/cumetal_fp32_codspeed.cu \
            -I"$CUMETAL_PREFIX/include" \
            -o "$VIBEQC_BENCH_BUILD/vibeqc_cumetal_fp32_benchmark"

      - name: Run CodSpeed FP32 CuMetal proxy suite
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          VIBEQC_CUMETAL_FP32_BENCH: ${{ github.workspace }}/build-cumetal-benchmark/vibeqc_cumetal_fp32_benchmark
        with:
          mode: walltime
          run: .venv/bin/python -m pytest benchmarks/test_cumetal_fp32_codspeed.py --codspeed -q

  upload-test-results:
    name: Upload CUDA test results
    timeout-minutes: 8
    needs: cuda-tests
    if: ${{ !cancelled() && (needs.cuda-tests.result == 'success' || needs.cuda-tests.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download CUDA test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-results-cuda-runtime
          path: test-results

      - name: Upload CUDA test results to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: test-results/vibeqc-cuda-runtime-junit.xml
          flags: cuda-runtime
          name: test-results/cuda-runtime
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1
