name: CI

on:
  # Pull requests already run the full workflow. Limit push runs to master so
  # a same-repository PR branch does not schedule the same jobs twice.
  push:
    branches: [master]
  pull_request:
  # Run required CI checks against GitHub's synthetic merge-queue commit.
  merge_group:
    types: [checks_requested]
  # Keep the exhaustive water Cartesian MP2-gradient finite difference off the
  # ordinary feedback path while still exercising it regularly.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_VERSION: "4.14"

# Coalesce superseded PR and master-push runs separately. PR updates cancel
# stale running work; master keeps the active run and replaces only the older
# pending run with the newest push. Scheduled/manual qualification keeps its
# own run ID.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      # Keep each compiler cache bounded so both matrix jobs can share the
      # repository's Actions cache quota. Compiler identity and flags remain
      # part of ccache's own key, so a miss affects speed rather than validity.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore ccache
        id: cpu_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cpu-v2-${{ matrix.compiler }}-${{ hashFiles('cmake/**', 'python/vibeqc_compiler/**', 'python/vibeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1_d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1.json') }}
          restore-keys: |
            ccache-cpu-v2-${{ matrix.compiler }}-
            ccache-cpu-${{ matrix.compiler }}-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          # Instrument only the GCC leg so the existing compiler matrix still
          # exercises an ordinary non-instrumented Clang build.
          COVERAGE_COMPILE_FLAGS: ${{ matrix.compiler == 'gcc' && '-fprofile-arcs -ftest-coverage -fprofile-update=atomic' || '' }}
          COVERAGE_LINK_FLAGS: ${{ matrix.compiler == 'gcc' && '--coverage' || '' }}
        run: >-
          cmake -S . -B build -G Ninja
          -DVIBEQC_ENABLE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DVIBEQC_COMPILER_CACHE=ccache
          -DCMAKE_CXX_FLAGS="${COVERAGE_COMPILE_FLAGS}"
          -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
          -DCMAKE_SHARED_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
      - name: Build
        run: cmake --build build --parallel
      - name: Save ccache immediately after build
        if: steps.cpu_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cpu_ccache.outputs.cache-primary-key }}
      - name: Show ccache statistics
        run: ccache --show-stats
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Generate current CUDA ownership report
        if: matrix.compiler == 'gcc'
        run: |
          mkdir -p .artifacts
          python3 tools/report_cuda_ownership.py --check \
            --output .artifacts/cuda-ownership-current.json
      - name: Preserve current CUDA ownership report
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ownership-current-${{ github.run_id }}
          path: .artifacts/cuda-ownership-current.json
          retention-days: 14
      - name: Collect C++ coverage
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install --yes lcov
          lcov --capture --directory build --output-file coverage-cpp.info \
            --exclude '/usr/*' --exclude '*/tests/*' \
            --ignore-errors mismatch,unused
      - name: Preserve C++ coverage for the upload-only job
        if: matrix.compiler == 'gcc'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-cpp
          path: coverage-cpp.info
          retention-days: 1

  cuda-compile:
    name: CUDA 12.9 compile (sm_120)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
      # Generated AOT objects are much larger than ordinary CPU objects, so
      # give the CUDA cache enough room while staying within the repo quota.
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Add NVIDIA CUDA repository
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy
          "$CUDACXX" --version
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore CUDA ccache
        id: cuda_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cuda-v2-12.9-sm120-${{ hashFiles('cmake/**', 'python/vibeqc_compiler/**', 'python/vibeqc/**', 'CMakeLists.txt', 'CMakePresets.json', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1_d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1.json') }}
          restore-keys: |
            ccache-cuda-v2-12.9-sm120-
            ccache-cuda-12.9-sm120-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Configure production CUDA compile check
        run: >-
          cmake --preset cuda-release-sm120
          -DVIBEQC_BUILD_TESTS=ON
          -DVIBEQC_CUDA_FAST_COMPILE=ON
          -DVIBEQC_CUDA_COMPILE_JOBS=3
          -DVIBEQC_COMPILER_CACHE=ccache
      - name: Compile production CUDA and runtime CTest
        # This target links the full vibeqc shared library. Native GFN2 CUDA is
        # therefore compiled, device-linked, and consumed through the public
        # method adapter as part of this existing integration gate.
        run: >-
          cmake --build --preset cuda-release-sm120
          --target vibeqc_cuda_runtime_tests --parallel 3
      # Persist the expensive native compile cache here so the next queued
      # master run can reuse it without waiting for the cache action's
      # end-of-job post step.
      - name: Save CUDA ccache immediately after build
        if: steps.cuda_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cuda_ccache.outputs.cache-primary-key }}
      - name: Check Fock and proposal preflight without a GPU
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          cmake --build --preset cuda-release-sm120 --target vibeqc_fock_build_tests vibeqc_scf_proposal_tests --parallel 2
          ctest --test-dir build/cuda-release-sm120 \
            -R '^vibeqc_(fock_build|scf_proposal)_tests$' --output-on-failure
      - name: Show CUDA ccache statistics
        run: ccache --show-stats
      # This is release resource evidence. The production compile-only step
      # above uses fast compilation and cannot supply acceptance resources.
      - name: Restore f-shell release objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/f-shell-cache
          key: f-shell-cuda-12.9-sm120-${{ hashFiles('include/**', 'python/vibeqc_compiler/**', 'tools/**') }}
          restore-keys: |
            f-shell-cuda-12.9-sm120-
      - name: Compile five representative f classes with release resources
        run: >-
          python3 tools/validate_f_shells.py --tier compile --smoke
          --nvcc "$CUDACXX" --compile-jobs 2 --compile-timeout 900
          --output build/f-shell-smoke.json
      - name: Restore generated XC compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/xc-cache
          key: xc-cuda-12.9-sm120-${{ hashFiles('include/**', 'python/vibeqc_compiler/common/**', 'python/vibeqc_compiler/integral/**', 'python/vibeqc_compiler/xc/**', 'tools/validate_xc.py') }}
          restore-keys: |
            xc-cuda-12.9-sm120-
      - name: Compile generated XC derivative consumers
        run: >-
          python3 tools/validate_xc.py --tier cuda-compile
          --functionals PBE --nvcc "$CUDACXX"
          --cache build/xc-cache --output build/xc-compile
      - name: Restore stationary CUDA compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/stationary-cuda-compile
          key: stationary-cuda-12.9-sm120-${{ hashFiles('python/vibeqc_compiler/common/**', 'python/vibeqc_compiler/integral/**', 'python/vibeqc_compiler/method/**', 'python/vibeqc_compiler/tensor/**', 'tools/validate_stationary_cuda_compile.py') }}
          restore-keys: |
            stationary-cuda-12.9-sm120-
      - name: Compile generated r2SCAN stationary CUDA consumer
        run: >-
          python3 tools/validate_stationary_cuda_compile.py
          --nvcc "$CUDACXX" --cache build/stationary-cuda-compile
      - name: Restore TensorIR CUDA compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tensor-static-cuda-compile
          key: tensor-static-cuda-12.9-sm120-${{ hashFiles('python/vibeqc_compiler/common/**', 'python/vibeqc_compiler/tensor/**', 'tools/validate_tensor_cuda_compile.py') }}
          restore-keys: |
            tensor-static-cuda-12.9-sm120-
      - name: Compile generated TensorIR static-data artifacts
        run: >-
          PYTHONPATH=python python3 tools/validate_tensor_cuda_compile.py
          --nvcc "$CUDACXX" --architecture sm_120
          --cache build/tensor-static-cuda-compile
      - name: Preserve generated XC resource reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xc-release-compile
          path: build/xc-compile
      - name: Preserve f-shell release resource report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: f-shell-release-smoke
          path: build/f-shell-smoke.json

  python:
    name: python (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, runtime-heavy, posthf, compiler-heavy, ecp-forces]
    runs-on: ubuntu-24.04
    # Full nightly/manual qualification includes expensive Hessian and Au replay.
    # Keep routine PR/push feedback capped separately; do not truncate that tier.
    # The core shard can spend over 18 minutes in pytest alone; include native
    # setup plus coverage/artifact cleanup without truncating scientific tests.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
    env:
      CCACHE_MAXSIZE: 1G
      # PySCF and NumPy can each fan out through BLAS/OpenMP. Keep those
      # libraries single-threaded so pytest-xdist owns the job-level parallelism.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore ccache
        id: python_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-python-v2-${{ hashFiles('cmake/**', 'python/vibeqc_compiler/**', 'python/vibeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1_d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1.json') }}
          restore-keys: |
            ccache-python-v2-
            ccache-python-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Prepare GFN2 CPU linear algebra runtime
        run: |
          uv venv --python 3.11 .venv-gfn2-build
          uv pip install --python .venv-gfn2-build/bin/python scipy
          xtb_linalg="$(
            .venv-gfn2-build/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy

          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "VIBEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Build the CPU native library
        run: |
          cmake -S . -B build -G Ninja \
            -DVIBEQC_ENABLE_CUDA=OFF \
            -DVIBEQC_BUILD_TESTS=OFF \
            -DVIBEQC_XTB_CPU_LINALG_LIBRARY="$VIBEQC_XTB_CPU_LINALG_LIBRARY" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIBEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
      # The five Python shards build the same native library. One shard saves
      # the cache immediately so the next queued master run can reuse it.
      - name: Save Python-build ccache immediately
        if: matrix.shard == 'core' && steps.python_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.python_ccache.outputs.cache-primary-key }}
      - name: Install the Python package and test dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --editable '.[test,reference-test]'
          # Exercise the public autograd contracts on every PR without pulling
          # CUDA wheels into this CPU job.
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
      - name: Show ccache statistics
        run: ccache --show-stats
      - name: Run Python tests with coverage
        env:
          VIBEQC_LIBRARY: ${{ github.workspace }}/build/libvibeqc.so
        run: |
          extra_args=()
          if [[ "${{ github.event_name }}" != "schedule" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            # Keep exhaustive qualification matrices on scheduled/manual CI.
            # Routine PR/master CI retains one complete CPU HF endpoint for
            # orbital-f and f-projector support, while avoiding redundant
            # spin/representation variants that dominate wall time under
            # --dist=loadfile.
            extra_args+=(
              --deselect
              'tests/python/test_mp2_gradient.py::test_dense_complete_gradient_matches_fully_resolved_finite_differences[water]'
              # The complete 55-class capability report performs bounded source
              # emission for every recurrence/schedule combination and costs
              # several minutes by itself. Focused capability/emitter tests stay
              # routine; retain the exhaustive catalog sweep nightly/manual.
              --deselect
              'tests/python/test_codegen.py::test_codegen_capability_report_covers_catalog_and_manifest'
              --deselect
              'tests/python/test_ecp_f.py::test_f_prepared_replay_with_planned_budget[cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[1-cartesian-cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[0-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[1-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[1-cartesian-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[0-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[1-spherical-cpu]'
              # Keep one direct f-shell complete-HF endpoint on routine CI.
              # The matching full projector replay is independently covered by
              # lighter projector contracts here and by the complete nightly run.
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[0-cartesian-cpu]'
              # Correlated-gradient acceptance contains reconverged molecular
              # finite differences and larger-molecule independent references.
              # H2/small-contract coverage stays routine; broad endpoint replay
              # belongs to scheduled/manual qualification.
              # The NH3 complete RCCSD(T) analytic-gradient endpoint is a
              # separate ~4.7 minute native solve on hosted runners. H2O stays
              # routine and is shared by the component/response checks through
              # the module cache; keep NH3 for scheduled/manual qualification.
              --deselect
              'tests/python/test_ccsd_t_complete_gradient.py::test_complete_ccsdt_gradient_matches_pinned_pyscf[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_complete_native_endpoint_matches_pinned_pyscf_gradient[ch4]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_complete_native_endpoint_matches_pinned_pyscf_gradient[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[h2o]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[h2_d_spherical]'
              # These are qualification-scale replays (roughly 1-2 minutes
              # each on hosted runners); smaller MP2/DFT/ECP/HVP contracts still
              # execute on every PR.
              --deselect
              'tests/python/test_mp2_gradient_fast.py::test_water_complete_gradient_matches_directional_finite_differences'
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_complete_hf_and_core_bookkeeping[cpu-1-Au]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_complete_asymmetric_water_analytic_and_reconverged_fd[lda-rks-reference]'
              --deselect
              'tests/python/test_second_derivatives_inputs.py::test_public_hvp_arbitrary_rotation_and_bra_shell_permutation[cpu-eri]'
              --deselect
              'tests/python/test_second_derivatives_inputs.py::test_contracted_public_hvp_matches_three_step_independent_gradient_fd[cpu-False-eri]'
              # Retain one representative high-angular/range path routinely;
              # move exhaustive symbolic/long-range qualification to nightly.
              --deselect
              'tests/python/test_high_angular.py::test_g_one_electron_all_components_libcint[nuclear_attraction-angular3]'
              --deselect
              'tests/python/test_codegen.py::test_dddp_rys5_recurrence_matches_every_symbolic_component'
              --deselect
              'tests/python/test_range_separation.py::test_generated_range_values_and_all_center_derivatives_against_libcint[angular3-cpu-long_range]'
              # The coarse-grid WB97M-V water finite-difference replay is
              # qualification-scale on hosted runners (~9.5 minutes in the
              # latest successful PR run). The higher-grid water RKS case and
              # both open-shell UKS cases remain on routine CI; keep this
              # redundant grid-shape replay for scheduled/manual qualification.
              --deselect
              'tests/python/test_wb97mv_complete.py::test_public_wb97mv_force_matches_reconverged_energy_differences[grid_shape0-water-rks]'
              # The module-scoped analytic Hessian fixture computes a complete
              # water Hessian before the first parametrized check. On hosted
              # runners that setup alone is ~27 minutes, so keep the H2 path
              # on routine CI and run the water qualification nightly/manual.
              --deselect
              'tests/python/test_hessian_analytic.py::test_first_order_sources_match_independent_native_derivatives[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_reference_is_the_native_converged_state[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_total_matches_independent_pyscf_hessian[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_components_match_independent_finite_difference_oracle[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_raw_total_invariants[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_three_step_directional_differences_of_native_forces[water]'
              # Au resource-boundary replay is a full qualification loop
              # (multiple converged displaced calculations) and currently
              # costs another ~7-10 minutes per spin case. The ordinary Au
              # energy/force checks remain on every PR.
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_resource_boundary_replay_complete_energy_difference[cpu-0-Au]'
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_resource_boundary_replay_complete_energy_difference[cpu-1-Au]'
              # Keep one response-functional variant on routine CI; the
              # alternate LDA reconverged response remains in nightly/manual.
              --deselect
              'tests/python/test_response_native_rks.py::test_complete_solve_and_reconverged_density_response[lda-rks]'
              --deselect
              'tests/python/test_response_native_uks.py::test_solve_reconverged_spin_densities_and_recycling[lda-uks]'
              # Standard production-grid RKS/UKS endpoints remain routine.
              # The tighter-profile duplicates are qualification coverage.
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_converges_against_independent_dense_quadrature[lda-rks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_converges_against_independent_dense_quadrature[pbe-rks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_open_shell_converges_against_independent_dense_quadrature[lda-uks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_open_shell_converges_against_independent_dense_quadrature[pbe-uks-tight]'
              # Closed-shell SPD ECP reconverged finite differences are
              # qualification-scale on hosted runners. The two LDA-UKS
              # reconverged finite-difference cases are also ~9 minutes each.
              # Keep the much faster PBE-UKS complete-force checks plus paired
              # and budgeted ECP contracts on routine CI; run the redundant
              # RKS/LDA qualification matrix on scheduled/manual CI.
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-rks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-rks]'
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[pbe-rks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[pbe-rks]'
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-uks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-uks]'
            )
          fi
          # Keep every routine Python test on every PR, but remove the single
          # 26-minute critical path by separating the known numerical/codegen
          # tails. New test files land in core automatically until they become
          # expensive enough to earn an explicit shard.
          dist_mode=loadfile
          slow_paths=(
            tests/python/test_cc_complete_gradient.py
            tests/python/test_cc_triples_response.py
            tests/python/test_ccsd_t_gradient_validation.py
            tests/python/test_ccsd_t_complete_gradient.py
            tests/python/test_dft_complete_cpu.py
            tests/python/test_ecp_stationary_cpu.py
            tests/python/test_ecp_public_cpu.py
            tests/python/test_ecp_spd_cartesian_cpu.py
            tests/python/test_ecp_spd_spherical_cpu.py
            tests/python/test_ecp_stuttgart_dft.py
            tests/python/test_ecp_f.py
            tests/python/test_ecp_f_projector.py
            tests/python/test_ecp_heavy.py
            tests/python/test_mp2_gradient.py
            tests/python/test_mp2_gradient_fast.py
            tests/python/test_hessian_analytic.py
            tests/python/test_hessian_directional.py
            tests/python/test_response_operator.py
            tests/python/test_codegen.py
            tests/python/test_codegen_autotune.py
            tests/python/test_codegen_profiles.py
            tests/python/test_d3_geometry_ir.py
            tests/python/test_d3_generated_ragged.py
            tests/python/test_high_angular.py
            tests/python/test_one_electron_derivatives.py
            tests/python/test_range_separation.py
            tests/python/test_second_derivatives_inputs.py
            # Empirically expensive routine files live in their own shard so
            # they cannot silently expand the broad core critical path.
            tests/python/test_response_native_rks.py
            tests/python/test_response_native_uks.py
            tests/python/test_mp2_public.py
            tests/python/test_ccsd_t_orbital_response.py
            tests/python/test_hessian_block.py
            tests/python/test_grid_policy_convergence.py
            tests/python/test_cc_triples_response_cuda.py
            tests/python/test_codegen_schedules.py
            tests/python/test_dft_batch.py
            tests/python/test_ecp_multicenter.py
            tests/python/test_cc_triples_lambda_response.py
            tests/python/test_cc_lambda_response.py
            tests/python/test_implicit_response.py
            tests/python/test_df_rys.py
            tests/python/test_hessian_numerical.py
            tests/python/test_one_electron_cpu_codegen.py
            tests/python/test_cc_solver.py
            tests/python/test_cc_lambda_solver.py
          )
          case "${{ matrix.shard }}" in
            core)
              # Core remains the broad fast lane. Empirically expensive files
              # are explicitly owned by runtime-heavy so routine test growth
              # cannot silently consume the entire job budget.
              dist_mode=worksteal
              test_targets=(tests/python)
              for path in "${slow_paths[@]}"; do
                extra_args+=(--ignore="${path}")
              done
              ;;
            runtime-heavy)
              # Keep file-scoped/module-scoped expensive fixtures on one worker.
              # worksteal can duplicate those setups across workers and inflate
              # wall time even when the collected test count barely changes.
              dist_mode=loadfile
              test_targets=(
                tests/python/test_response_native_rks.py
                tests/python/test_response_native_uks.py
                tests/python/test_mp2_public.py
                tests/python/test_ccsd_t_orbital_response.py
                tests/python/test_hessian_block.py
                tests/python/test_grid_policy_convergence.py
                tests/python/test_cc_triples_response_cuda.py
                tests/python/test_codegen_schedules.py
                tests/python/test_dft_batch.py
                tests/python/test_ecp_multicenter.py
                tests/python/test_cc_triples_lambda_response.py
                tests/python/test_cc_lambda_response.py
                tests/python/test_implicit_response.py
                tests/python/test_df_rys.py
                tests/python/test_hessian_numerical.py
                tests/python/test_one_electron_cpu_codegen.py
                tests/python/test_cc_solver.py
                tests/python/test_cc_lambda_solver.py
              )
              ;;
            posthf)
              test_targets=(
                tests/python/test_cc_complete_gradient.py
                tests/python/test_cc_triples_response.py
                tests/python/test_ccsd_t_gradient_validation.py
                tests/python/test_ccsd_t_complete_gradient.py
                tests/python/test_dft_complete_cpu.py
                tests/python/test_ecp_stationary_cpu.py
                tests/python/test_ecp_f.py
                tests/python/test_ecp_f_projector.py
                tests/python/test_ecp_heavy.py
                tests/python/test_mp2_gradient.py
                tests/python/test_mp2_gradient_fast.py
                tests/python/test_hessian_analytic.py
                tests/python/test_hessian_directional.py
                tests/python/test_response_operator.py
              )
              ;;
            ecp-forces)
              # Full d-force qualification exceeded the 20-minute job cap when
              # serialized in one file. Keep every case, split representations
              # across loadfile workers, and retain the existing job time cap.
              test_targets=(
                tests/python/test_ecp_public_cpu.py
                tests/python/test_ecp_spd_cartesian_cpu.py
                tests/python/test_ecp_spd_spherical_cpu.py
                tests/python/test_ecp_stuttgart_dft.py
              )
              ;;
            compiler-heavy)
              test_targets=(
                tests/python/test_codegen.py
                tests/python/test_codegen_autotune.py
                tests/python/test_codegen_profiles.py
                tests/python/test_d3_geometry_ir.py
                tests/python/test_d3_generated_ragged.py
                tests/python/test_high_angular.py
                tests/python/test_one_electron_derivatives.py
                tests/python/test_range_separation.py
                tests/python/test_second_derivatives_inputs.py
              )
              ;;
            *)
              echo "::error::unknown Python shard: ${{ matrix.shard }}"
              exit 2
              ;;
          esac
          .venv/bin/python -m pytest "${test_targets[@]}" -q \
            -n 4 --dist="$dist_mode" --durations=25 \
            --junitxml=".artifacts/pytest-${{ matrix.shard }}.xml" \
            --cov --cov-report="xml:coverage-python-${{ matrix.shard }}.xml" \
            "${extra_args[@]}"
      - name: Preserve transient benchmark/debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-debug-${{ github.run_id }}-${{ matrix.shard }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Python coverage for the upload-only job
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-python-${{ matrix.shard }}
          path: coverage-python-${{ matrix.shard }}.xml
          retention-days: 1


  cpu-benchmark:
    name: CPU performance (CodSpeed)
    # PRs always run two representative endpoints and add targeted coverage when
    # changed paths touch advanced DFT machinery; master/manual runs the full
    # endpoint set. Scheduled qualification already has expensive numerical
    # coverage and does not need duplicate performance instrumentation.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CCACHE_MAXSIZE: 1G
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      VIBEQC_CODSPEED_TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select change-aware PR CodSpeed coverage
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(
            git diff --name-only --no-renames \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --
          )"
          extra_cases=""
          if grep -Eq \
            '^(benchmarks/test_cpu_codspeed\.py$|\.github/workflows/ci\.yml$|src/dft/|src/scf/|src/methods/|src/integrals/|include/vibeqc([./])|python/vibeqc/|python/vibeqc_compiler/(dft|xc)/|python/vibeqc_compiler/(method|integral)/|manifests/|upstream/libxc/|tools/(generate_xc|libxc))' \
            <<<"$changed_files"; then
            extra_cases="wb97mv"
          fi
          echo "VIBEQC_CODSPEED_EXTRA_CASES=${extra_cases}" >> "$GITHUB_ENV"
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
      - name: Restore CPU benchmark ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cpu-benchmark-v2-${{ hashFiles('cmake/**', 'python/vibeqc_compiler/**', 'python/vibeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'manifests/xtbloom-d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1_d3.json', 'upstream/xtbloom/2cbdf1db8661ccbd5cb7d3d4bfc868a848cbbff3/gfn1.json') }}
          restore-keys: |
            ccache-cpu-benchmark-v2-
            ccache-cpu-benchmark-
      - name: Reset CPU benchmark ccache statistics
        run: ccache --zero-stats
      - name: Build CPU benchmark library
        run: |
          cmake -S . -B build-benchmark -G Ninja \
            -DVIBEQC_ENABLE_CUDA=OFF \
            -DVIBEQC_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DVIBEQC_COMPILER_CACHE=ccache
          cmake --build build-benchmark --target vibeqc --parallel
      - name: Show CPU benchmark ccache statistics
        run: ccache --show-stats
      - name: Install benchmark dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --editable .
          uv pip install --python .venv/bin/python pytest-codspeed==5.0.3
      - name: Run CPU CodSpeed endpoint suite
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        env:
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-benchmark/libvibeqc.so
        with:
          # Hosted GitHub runners are noisy for wall-clock gating; simulation
          # provides the stable PR/master regression signal without Macro Runner quota.
          # PRs keep two always-on endpoints and can add a targeted advanced-DFT
          # endpoint through VIBEQC_CODSPEED_EXTRA_CASES.
          mode: simulation
          run: .venv/bin/python -m pytest benchmarks/test_cpu_codspeed.py --codspeed -q

  upload-coverage:
    timeout-minutes: 8
    needs: [cpu, python]
    if: ${{ !cancelled() && needs.cpu.result == 'success' && needs.python.result == 'success' }}
    # Coverage reporting is observability rather than a correctness gate. A
    # Codecov or artifact-service outage must not fail the workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: coverage-report-cpp
            file: coverage/coverage-cpp.info
            flag: cpp
            name: code-coverage/cpp
          - artifact: coverage-report-python-core
            file: coverage/coverage-python-core.xml
            flag: python
            name: code-coverage/python-core
          - artifact: coverage-report-python-runtime-heavy
            file: coverage/coverage-python-runtime-heavy.xml
            flag: python
            name: code-coverage/python-runtime-heavy
          - artifact: coverage-report-python-posthf
            file: coverage/coverage-python-posthf.xml
            flag: python
            name: code-coverage/python-posthf
          - artifact: coverage-report-python-compiler-heavy
            file: coverage/coverage-python-compiler-heavy.xml
            flag: python
            name: code-coverage/python-compiler-heavy
          - artifact: coverage-report-python-ecp-forces
            file: coverage/coverage-python-ecp-forces.xml
            flag: python
            name: code-coverage/python-ecp-forces
    runs-on: ubuntu-24.04
    # Keep OIDC away from jobs that build or execute pull-request code. This
    # job checks out source metadata and consumes coverage artifacts only.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: coverage
      - name: Upload coverage to Codecov
        # fail_ci_if_error covers CLI upload errors; continue-on-error also
        # covers action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.file }}
          flags: ${{ matrix.flag }}
          name: ${{ matrix.name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1

  pass:
    name: Pass CI checks
    timeout-minutes: 5
    needs: [cpu, cuda-compile, python]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
