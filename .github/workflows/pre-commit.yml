name: Pre-commit

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek/
          key: prek-0.3.1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-0.3.1-${{ runner.os }}-
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Type-check Python compiler
        run: uvx --with 'numpy>=1.24' ty==0.0.82 check
      - name: Check new benchmark evidence against the PR base
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/evidence.py check-change --base "$EVIDENCE_BASE"
      - name: Prevent legacy codegen test regrowth
        if: github.event_name == 'pull_request'
        env:
          OWNERSHIP_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare with the base actually tested, not a stale event base SHA.
          read -r merge base head extra <<< "$(git rev-list --parents -n 1 HEAD)"
          if [[ -z "$base" || -n "$extra" || "$head" != "$OWNERSHIP_HEAD" ]]; then
            echo "Expected a two-parent PR test merge with the requested head" >&2
            exit 1
          fi
          baseline="$RUNNER_TEMP/codegen-test-baseline.py"
          git show "$base:tests/python/test_codegen.py" > "$baseline"
          python3 tools/check_codegen_test_ownership.py --baseline "$baseline"
      - name: Run pre-commit hooks on all files
        run: >-
          uvx --from prek==0.3.1 prek run
          --all-files
          --show-diff-on-failure
