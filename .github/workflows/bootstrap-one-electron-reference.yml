name: Bootstrap one-electron reference

on:
  push:
    branches: [chatgpt/ci-committed-one-electron-ref]
    paths: [.github/workflows/bootstrap-one-electron-reference.yml]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
      - name: Install reference generator dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --editable '.[reference-test]'
      - name: Generate the independent reference bundle
        run: >-
          .venv/bin/python -m tools.generate_one_electron_derivative_references
          --output tests/reference_data/one_electron_derivatives
      - name: Commit the generated fixture to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/reference_data/one_electron_derivatives
          git diff --cached --quiet && exit 0
          git commit -m 'test: commit one-electron derivative references' \
            -m 'Agent: ChatGPT' \
            -m 'Model: GPT-5.6 Sol'
          git push origin HEAD:chatgpt/ci-committed-one-electron-ref
