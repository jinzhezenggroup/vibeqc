name: Python wheels

# Build with CUDA 12.9 while keeping NVIDIA provider DSOs outside the VibeQC
# wheel. The wheel metadata declares the separately distributed providers as
# Linux runtime dependencies, and the installed-wheel test proves lazy provider
# resolution through a CUDA-backed native call.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build CUDA manylinux wheel
    runs-on: ubuntu-24.04
    # A cold cache must be able to finish once so actions/cache can seed the
    # normalized v2 compiler cache; warm runs should return well below this cap.
    timeout-minutes: 45
    env:
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-wheel-v2-manylinux_x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'python/vibeqc_compiler/**', 'tools/**', 'pyproject.toml') }}
          restore-keys: |
            ccache-wheel-v2-manylinux_x86_64-

      - name: Restore cibuildwheel tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-manylinux_x86_64-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-manylinux_x86_64-

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        env:
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          # cibuildwheel mounts the host root at /host inside the manylinux
          # container, so the compiler cache survives the container lifetime.
          # scikit-build-core creates a fresh /tmp/tmp*/build directory on every
          # invocation. Normalize those transient absolute paths before ccache
          # hashes the CMake/NVCC command line; otherwise generated-source and
          # generated-include paths make identical compilations miss across runs.
          CIBW_ENVIRONMENT: >-
            VIBEQC_ENABLE_CUDA=ON
            VIBEQC_ENABLE_AOT_SHELLS=ON
            VIBEQC_CUDA_ARCHITECTURES=120
            CCACHE_DIR=/host${{ runner.temp }}/ccache
            CCACHE_MAXSIZE=3G
            CCACHE_BASEDIR=/tmp
            CCACHE_COMPILERCHECK=content
        with:
          package-dir: .
          output-dir: wheelhouse
          extras: "uv"

      - name: Verify wheel payload and CUDA linkage
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import subprocess
          import tempfile
          import zipfile

          wheels = glob.glob("wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              # Check the repaired artifact: vendored trampoline notices must
              # reach users together with the native code generated from them.
              metadata_dirs = {
                  name.split("/", 1)[0]
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              }
              assert len(metadata_dirs) == 1, metadata_dirs
              metadata_dir = metadata_dirs.pop()
              for license_file in ("LICENSE", "LICENSES/implib-MIT.txt", "THIRD_PARTY_NOTICES.md"):
                  installed_notice = f"{metadata_dir}/licenses/{license_file}"
                  assert installed_notice in names, installed_notice
                  assert archive.read(installed_notice) == pathlib.Path(license_file).read_bytes()
              assert "vibeqc/lib/libvibeqc.so" in names, sorted(
                  name
                  for name in names
                  if "vibeqc" in name and name.endswith((".so", ".dll", ".dylib"))
              )
              cuda_provider_names = (
                  "libcudart.so",
                  "libcublas.so",
                  "libcublasLt.so",
                  "libcusolver.so",
                  "libcusparse.so",
                  "libnvJitLink.so",
                  "libcuda.so",
              )
              bundled_cuda = [
                  name
                  for name in names
                  if pathlib.PurePosixPath(name).name.startswith(cuda_provider_names)
              ]
              assert not bundled_cuda, bundled_cuda
              with tempfile.TemporaryDirectory() as directory:
                  native = pathlib.Path(directory) / "libvibeqc.so"
                  native.write_bytes(archive.read("vibeqc/lib/libvibeqc.so"))
                  dynamic = subprocess.check_output(
                      ["readelf", "-d", str(native)], text=True
                  )

          for soname in ("libcudart.so.12", "libcublas.so.12", "libcusolver.so.11"):
              assert f"Shared library: [{soname}]" not in dynamic, dynamic
          assert "Shared library: [libcuda.so.1]" not in dynamic, dynamic
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vibeqc-wheel-manylinux_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  pass:
    name: Pass building wheels
    timeout-minutes: 5
    needs: [build_wheels]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Decide whether the wheel build succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
