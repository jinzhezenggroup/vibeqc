name: xTB orbital guess validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
      - name: Prepare GFN2 CPU linear algebra runtime
        run: |
          uv venv --python 3.11 .venv-gfn2-build
          uv pip install --python .venv-gfn2-build/bin/python scipy
          xtb_linalg="$(
            .venv-gfn2-build/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy
          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "VIBEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Build CPU library
        run: |
          cmake -S . -B build-xtb-orbital -G Ninja \
            -DVIBEQC_ENABLE_CUDA=OFF \
            -DVIBEQC_BUILD_TESTS=OFF \
            -DVIBEQC_XTB_CPU_LINALG_LIBRARY="$VIBEQC_XTB_CPU_LINALG_LIBRARY" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-xtb-orbital --target vibeqc --parallel
      - name: Run occupied-subspace endpoint validation
        env:
          VIBEQC_LIBRARY: ${{ github.workspace }}/build-xtb-orbital/libvibeqc.so
        run: |
          uv venv --python 3.11 .venv-validation
          uv pip install --python .venv-validation/bin/python pytest
          .venv-validation/bin/python -m pytest tests/python/test_xtb_orbital_guess_validation.py -q
      - name: Upload orbital projection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xtb-orbital-guess-validation
          path: .artifacts/xtb-orbital-guess-validation.json
          if-no-files-found: warn
          retention-days: 7
