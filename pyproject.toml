[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeqc"
version = "0.1.0"
description = "VibeQC: GPU-native batched quantum chemistry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]
torch = ["torch>=2"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
vibeqc = ["data/*.json"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["python/vibeqc"]
