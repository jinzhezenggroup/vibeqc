[build-system]
# GFN2 wheel CMake resolves this reviewed provider inside PEP 517 isolation.
requires = ["scikit-build-core>=1.0.3", "numpy>=1.24", "scipy-openblas32==0.3.34.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vibeqc"
version = "0.1.0"
description = "VibeQC: GPU-native batched quantum chemistry"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
# The native wheel contains Implib-generated code, so its MIT notice must ship
# alongside the project license; default root-level license globs miss it.
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "numpy>=1.24",
  "nvidia-cublas-cu12>=12.9.1.4; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusolver-cu12>=11.7.5.82; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusparse-cu12>=12.5.10.65; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cuda-runtime-cu12>=12.9.79; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-nvjitlink-cu12>=12.9.86; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "pytest-xdist>=3.8"]
reference-test = ["scipy>=1.10", "pyscf==2.14.0", "mpmath>=1.3", "threadpoolctl>=3.1"]
torch = ["torch>=2"]
autotune = ["pyscf>=2.8"]
# Compatibility alias retained for callers that already install
# `vibeqc[cuda12]`. Linux CUDA wheel providers are base runtime dependencies
# because NVCC registration constructors need cudart while libvibeqc.so loads.
cuda12 = []

[project.scripts]
vibeqc = "vibeqc.__main__:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
cmake.args = [
  "-DVIBEQC_BUILD_TESTS=OFF",
  "-DVIBEQC_PYTHON_WHEEL=ON",
  "-DCMAKE_INSTALL_LIBDIR=lib",
  "-DCMAKE_INSTALL_BINDIR=bin",
]
wheel.packages = ["python/vibeqc", "python/vibeqc_compiler"]
wheel.install-dir = "vibeqc"
# VibeQC uses ctypes against a stable C ABI rather than a CPython extension,
# so one native wheel works across all supported Python 3 versions.
wheel.py-api = "py3"

[tool.scikit-build.wheel.force-include]
"src/runtime/cuda_graph_region.cuh" = "vibeqc_compiler/assets/src/runtime/cuda_graph_region.cuh"
"src/tensor/cuda_graph_context.cuh" = "vibeqc_compiler/assets/src/tensor/cuda_graph_context.cuh"
# JIT templates need their transitive local headers in installed wheels too.
"src/tensor/cuda_runtime.cuh" = "vibeqc_compiler/assets/src/tensor/cuda_runtime.cuh"
"src/tensor/cuda_resident.cuh" = "vibeqc_compiler/assets/src/tensor/cuda_resident.cuh"
"src/cc/cuda_state.cuh" = "vibeqc_compiler/assets/src/cc/cuda_state.cuh"
"src/tensor/cuda_error.hpp" = "vibeqc_compiler/assets/src/tensor/cuda_error.hpp"
"src/tensor/metrics.hpp" = "vibeqc_compiler/assets/src/tensor/metrics.hpp"
"src/tensor/cpu_runtime.hpp" = "vibeqc_compiler/assets/src/tensor/cpu_runtime.hpp"
"src/dft/grid_response_cpu.hpp" = "vibeqc_compiler/assets/src/dft/grid_response_cpu.hpp"
"src/dft/stationary_gradient_cuda.cuh" = "vibeqc_compiler/assets/src/dft/stationary_gradient_cuda.cuh"
"src/runtime/allocation_measurement.hpp" = "vibeqc_compiler/assets/src/runtime/allocation_measurement.hpp"
"src/runtime/bounded_workspace.hpp" = "vibeqc_compiler/assets/src/runtime/bounded_workspace.hpp"
"src/runtime/cuda_resources.cuh" = "vibeqc_compiler/assets/src/runtime/cuda_resources.cuh"
"src/runtime/resource_cuda.cuh" = "vibeqc_compiler/assets/src/runtime/resource_cuda.cuh"
"src/runtime/resource_ledger.hpp" = "vibeqc_compiler/assets/src/runtime/resource_ledger.hpp"
"src/dft/cuda_grid.cu" = "vibeqc_compiler/assets/src/dft/cuda_grid.cu"
"src/dft/grid_task_view.cuh" = "vibeqc_compiler/assets/src/dft/grid_task_view.cuh"
"src/dft/xc_point.hpp" = "vibeqc_compiler/assets/src/dft/xc_point.hpp"
"src/dft/xc_runtime.cuh" = "vibeqc_compiler/assets/src/dft/xc_runtime.cuh"
"src/integrals/range_moments.hpp" = "vibeqc_compiler/assets/src/integrals/range_moments.hpp"
"src/integrals/eri_geometry.hpp" = "vibeqc_compiler/assets/src/integrals/eri_geometry.hpp"
"src/integrals/first_component_runtime.hpp" = "vibeqc_compiler/assets/src/integrals/first_component_runtime.hpp"
"src/integrals/first_directional_runtime.cuh" = "vibeqc_compiler/assets/src/integrals/first_directional_runtime.cuh"
"src/integrals/first_derivative_runtime.hpp" = "vibeqc_compiler/assets/src/integrals/first_derivative_runtime.hpp"
"src/integrals/first_derivative_component_runtime.hpp" = "vibeqc_compiler/assets/src/integrals/first_derivative_component_runtime.hpp"
"src/scf/cuda_weighted_eri.hpp" = "vibeqc_compiler/assets/src/scf/cuda_weighted_eri.hpp"
"src/scf/weighted_eri_runtime.hpp" = "vibeqc_compiler/assets/src/scf/weighted_eri_runtime.hpp"
"include/vibeqc/vibeqc.h" = "vibeqc_compiler/assets/include/vibeqc/vibeqc.h"
"include/vibeqc/generated_method_ids.h" = "vibeqc_compiler/assets/include/vibeqc/generated_method_ids.h"
"external/libxc-7.0.0" = "vibeqc_compiler/assets/external/libxc-7.0.0"
"upstream/libxc/7.0.0" = "vibeqc_compiler/assets/upstream/libxc/7.0.0"
"external/xtbloom-d3" = "vibeqc_compiler/assets/external/xtbloom-d3"

[tool.scikit-build.cmake.define]
VIBEQC_ENABLE_CUDA = { env = "VIBEQC_ENABLE_CUDA", default = "ON" }
VIBEQC_ENABLE_AOT_SHELLS = { env = "VIBEQC_ENABLE_AOT_SHELLS", default = "ON" }
VIBEQC_ENABLE_STATIONARY_FORCE_AOT = { env = "VIBEQC_ENABLE_STATIONARY_FORCE_AOT", default = "ON" }
VIBEQC_CUDA_ARCHITECTURES = { env = "VIBEQC_CUDA_ARCHITECTURES", default = "" }

# Keep wheel production aligned with xTBloom's proven cibuildwheel path. Because
# VibeQC's Python ABI is ctypes-based, one CPython build is enough to emit the
# shared py3 platform wheel for all supported Python 3 versions.
[tool.cibuildwheel]
build = ["cp311-manylinux_x86_64"]
build-frontend = "build[uv]"
skip = ["*-manylinux_i686", "*-musllinux*"]
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:2026.06.30-1"
test-command = "python -c 'import ctypes; from vibeqc import _native; from vibeqc.profiles import DeviceDescriptor; descriptor=DeviceDescriptor(); descriptor.struct_size=ctypes.sizeof(descriptor); descriptor.abi_version=_native.ABI_VERSION; probe=_native.load_library().vibeqc_cuda_tuning_device; probe.argtypes=[ctypes.c_int32, ctypes.POINTER(DeviceDescriptor)]; probe.restype=ctypes.c_int; print(probe(0, ctypes.byref(descriptor)))'"

[tool.cibuildwheel.linux]
# manylinux_2_28 ships a ccache too old for nvcc. The CUDA provider shared
# libraries are not build inputs: VibeQC's wheel-mode Implib.so trampolines
# compile from nvcc headers and resolve the separately installed providers only
# at runtime, matching xTBloom's provider-free build boundary.
# Keep a second provider environment alive for the later auditwheel repair.
before-build = "bash {package}/python/ci/prepare-wheel-build.sh"
repair-wheel-command = "bash {package}/python/ci/repair-wheel.sh {dest_dir} {wheel}"

[tool.coverage.run]
branch = true
relative_files = true
source = ["python/vibeqc"]

[tool.ruff]
extend-exclude = ["upstream", "external/libxc-7.0.0", "cmake/3rdparty/implib", "benchmarks/results"]

[tool.ruff.lint]
extend-select = [
  "ANN",
  "TC",
  "NPY001",
  "NPY003",
  "NPY201",
  "PGH003",
  "PGH004",
  "S",
  "RET502",
  "RET503",
  "PLW2901",
  "RUF102",
  "RUF103",
  "RUF104",
  "A005",
]
# Assertions are pervasive internal/test invariants; subprocess invocation is a core compiler/tooling boundary.
# Keep the narrower shell-injection checks active while avoiding blanket S603/S607 noise.
ignore = ["ANN401", "S101", "S603", "S607"]
[tool.ruff.lint.per-file-ignores]
# Scope known-safe historical uses instead of disabling these checks repository-wide.
".github/scripts/run_cumetal_cuda_pytests.py" = ["S108", "S314"]
"benchmarks/shell_class_histogram.py" = ["S608"]
"python/vibeqc_compiler/tensor/optimize.py" = ["S105"]
"tests/**/*.py" = ["S108", "S311", "S314", "S324"]
"tools/**/*.py" = ["S108"]
"tools/vibeqc_validation/retention.py" = ["S314"]

# Python compiler type checking with Astral ty.
# Files in the override contain remaining pre-existing type debt as of 2026-09-20.
# Diagnostics stay visible as warnings; clean files must return to normal strict checking.

[tool.ty.environment]
root = ["python"]

[tool.ty.src]
include = ["python/vibeqc_compiler"]

[tool.ty.terminal]
error-on-warning = false
output-format = "github"

[[tool.ty.overrides]]
include = [
  "python/vibeqc_compiler/common/resources.py",
  "python/vibeqc_compiler/common/specialization.py",
  "python/vibeqc_compiler/integral/batch_benchmark.py",
  "python/vibeqc_compiler/integral/blocks.py",
  "python/vibeqc_compiler/integral/capabilities.py",
  "python/vibeqc_compiler/integral/df_derivatives.py",
  "python/vibeqc_compiler/integral/df_rys_shell.py",
  "python/vibeqc_compiler/integral/df_shell_derivatives.py",
  "python/vibeqc_compiler/integral/df_value_candidates.py",
  "python/vibeqc_compiler/integral/df_values.py",
  "python/vibeqc_compiler/integral/expr.py",
  "python/vibeqc_compiler/integral/fused_schedule.py",
  "python/vibeqc_compiler/integral/ir.py",
  "python/vibeqc_compiler/integral/ir_serialization.py",
  "python/vibeqc_compiler/integral/production_profile.py",
  "python/vibeqc_compiler/integral/range_separation.py",
  "python/vibeqc_compiler/integral/rys.py",
  "python/vibeqc_compiler/integral/second_derivatives.py",
  "python/vibeqc_compiler/integral/second_derivatives_execute.py",
  "python/vibeqc_compiler/integral/shell_class.py",
  "python/vibeqc_compiler/integral/tuning/analysis.py",
  "python/vibeqc_compiler/integral/tuning/cli.py",
  "python/vibeqc_compiler/integral/tuning/driver.py",
  "python/vibeqc_compiler/integral/weighted_eri_cuda.py",
  "python/vibeqc_compiler/integral/weighted_eri_execute.py",
  "python/vibeqc_compiler/integral/weighted_eri_inputs.py",
  "python/vibeqc_compiler/integral/weighted_eri_native.py",
  "python/vibeqc_compiler/tensor/ad_program.py",
  "python/vibeqc_compiler/tensor/autodiff.py",
  "python/vibeqc_compiler/tensor/cuda_emit.py",
  "python/vibeqc_compiler/tensor/cuda_plan.py",
  "python/vibeqc_compiler/tensor/cuda_resident.py",
  "python/vibeqc_compiler/tensor/cuda_tune.py",
  "python/vibeqc_compiler/xc/prepared.py",
]

[tool.ty.overrides.rules]
all = "warn"
